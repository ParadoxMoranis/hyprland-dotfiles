# Generated by install.sh. Metadata comments let the installer customize every binding.

# bind-meta: terminal|core|打开终端
bind = SUPER, RETURN, exec, $terminal
# bind-meta: launcher|core|打开应用启动器
bind = SUPER, D, exec, rofi -show drun
# bind-meta: close_window|core|关闭当前窗口
bind = SUPER, Q, killactive,
# bind-meta: exit_hyprland|core|退出 Hyprland
bind = SUPER, M, exit,
# bind-meta: file_manager|core|打开文件管理器
bind = SUPER, E, exec, $fileManager
# bind-meta: clipboard_history|clipboard|剪贴板历史
bind = SUPER, V, exec, cliphist list | rofi -dmenu -p "剪贴板" -theme ~/.config/rofi/themes/monochrome.rasi | cliphist decode | wl-copy
# bind-meta: pinned_clipboard|pinned_clipboard|固定剪贴板
bind = SUPER, N, exec, ~/.config/hypr/scripts/pinned-clipboard.sh
# bind-meta: command_menu|core|打开命令菜单
bind = SUPER, R, exec, $menu
# bind-meta: monitor_menu|monitor_menu|显示器设置菜单
bind = SUPER, U, exec, ~/.config/hypr/scripts/monitor-menu.py --backend hypr
# bind-meta: audio_device_menu|audio_device_menu|选择音频输入或输出设备
bind = SUPER, A, exec, ~/.config/hypr/scripts/audio-device-menu.sh
# bind-meta: pseudo_tile|core|切换伪平铺
bind = SUPER, P, pseudo,
# bind-meta: toggle_split|core|切换分割方向
bind = SUPER, J, layoutmsg, togglesplit
# bind-meta: fullscreen|core|切换全屏
bind = SUPER, F, fullscreen,
# bind-meta: focus_left|core|焦点向左
bind = SUPER, left, movefocus, l
# bind-meta: focus_right|core|焦点向右
bind = SUPER, right, movefocus, r
# bind-meta: focus_up|core|焦点向上
bind = SUPER, up, movefocus, u
# bind-meta: focus_down|core|焦点向下
bind = SUPER, down, movefocus, d
# bind-meta: workspace_1|core|切换到工作区 1
bind = SUPER, 1, workspace, 1
# bind-meta: workspace_2|core|切换到工作区 2
bind = SUPER, 2, workspace, 2
# bind-meta: workspace_3|core|切换到工作区 3
bind = SUPER, 3, workspace, 3
# bind-meta: workspace_4|core|切换到工作区 4
bind = SUPER, 4, workspace, 4
# bind-meta: workspace_5|core|切换到工作区 5
bind = SUPER, 5, workspace, 5
# bind-meta: workspace_6|core|切换到工作区 6
bind = SUPER, 6, workspace, 6
# bind-meta: workspace_7|core|切换到工作区 7
bind = SUPER, 7, workspace, 7
# bind-meta: workspace_8|core|切换到工作区 8
bind = SUPER, 8, workspace, 8
# bind-meta: workspace_9|core|切换到工作区 9
bind = SUPER, 9, workspace, 9
# bind-meta: workspace_10|core|切换到工作区 10
bind = SUPER, 0, workspace, 10
# bind-meta: move_workspace_1|core|窗口移到工作区 1
bind = SUPER SHIFT, 1, movetoworkspace, 1
# bind-meta: move_workspace_2|core|窗口移到工作区 2
bind = SUPER SHIFT, 2, movetoworkspace, 2
# bind-meta: move_workspace_3|core|窗口移到工作区 3
bind = SUPER SHIFT, 3, movetoworkspace, 3
# bind-meta: move_workspace_4|core|窗口移到工作区 4
bind = SUPER SHIFT, 4, movetoworkspace, 4
# bind-meta: move_workspace_5|core|窗口移到工作区 5
bind = SUPER SHIFT, 5, movetoworkspace, 5
# bind-meta: move_workspace_6|core|窗口移到工作区 6
bind = SUPER SHIFT, 6, movetoworkspace, 6
# bind-meta: move_workspace_7|core|窗口移到工作区 7
bind = SUPER SHIFT, 7, movetoworkspace, 7
# bind-meta: move_workspace_8|core|窗口移到工作区 8
bind = SUPER SHIFT, 8, movetoworkspace, 8
# bind-meta: move_workspace_9|core|窗口移到工作区 9
bind = SUPER SHIFT, 9, movetoworkspace, 9
# bind-meta: move_workspace_10|core|窗口移到工作区 10
bind = SUPER SHIFT, 0, movetoworkspace, 10
# bind-meta: scratchpad_toggle|core|显示或隐藏临时工作区
bind = SUPER, minus, togglespecialworkspace, magic
# bind-meta: scratchpad_move|core|窗口移到临时工作区
bind = SUPER SHIFT, minus, movetoworkspace, special:magic
# bind-meta: workspace_next|core|滚轮切到下一工作区
bind = SUPER, mouse_down, workspace, e+1
# bind-meta: workspace_previous|core|滚轮切到上一工作区
bind = SUPER, mouse_up, workspace, e-1
# bind-meta: mouse_move_window|core|鼠标拖动窗口
bindm = SUPER, mouse:272, movewindow
# bind-meta: mouse_resize_window|core|鼠标调整窗口大小
bindm = SUPER, mouse:273, resizewindow
# bind-meta: volume_up|audio_keys|音量增加
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# bind-meta: volume_down|audio_keys|音量降低
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bind-meta: volume_mute|audio_keys|静音切换
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bind-meta: microphone_mute|audio_keys|麦克风静音切换
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bind-meta: brightness_up|brightness_keys|亮度增加
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
# bind-meta: brightness_down|brightness_keys|亮度降低
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
# bind-meta: media_next|media_keys|下一首
bindl = , XF86AudioNext, exec, playerctl next
# bind-meta: media_pause|media_keys|暂停或继续
bindl = , XF86AudioPause, exec, playerctl play-pause
# bind-meta: media_play|media_keys|播放或暂停
bindl = , XF86AudioPlay, exec, playerctl play-pause
# bind-meta: media_previous|media_keys|上一首
bindl = , XF86AudioPrev, exec, playerctl previous
# bind-meta: screenshot_area_edit|screenshots|选区截图并编辑
bind = SUPER SHIFT, S, exec, ~/.config/hypr/screenshot.sh area-satty
# bind-meta: screenshot_full_copy|screenshots|全屏截图并复制
bind = , PRINT, exec, ~/.config/hypr/screenshot.sh full-copy
# bind-meta: screenshot_full_edit|screenshots|全屏截图并编辑
bind = SHIFT, PRINT, exec, ~/.config/hypr/screenshot.sh full-satty
# bind-meta: screenshot_area_copy|screenshots|选区截图并复制
bind = SUPER, PRINT, exec, ~/.config/hypr/screenshot.sh area-copy
# bind-meta: screenshot_area_save|screenshots|选区截图并保存
bind = SUPER SHIFT, PRINT, exec, ~/.config/hypr/screenshot.sh area-save
# bind-meta: screenshot_area_edit_alt|screenshots|选区截图并编辑（备用）
bind = CTRL, PRINT, exec, ~/.config/hypr/screenshot.sh area-satty
# bind-meta: show_keybinds|keybind_help|显示快捷键列表
bind = SUPER, H, exec, ~/.config/hypr/show_keybinds.sh
